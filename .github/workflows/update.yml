name: Update from blog

on:
  schedule:
    - cron: "5 15 * * *"   # 9:05 AM CST (UTC-6)
    - cron: "5 4 * * *"    # 10:05 PM CST (UTC-6)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "config.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Add new posts and rebuild
        run: python tools/update_site.py
      - name: Commit changes
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add new blog posts" && git push)
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
